name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: publish-firefox-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check version and existing release
        id: version
        shell: bash
        run: |
          version=$(jq -er .version extension/manifest.json)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false; then
            echo "Release $tag is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              [[ "$(git rev-list -n 1 "$tag")" == "$(git rev-parse HEAD)" ]]
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: firefox-xpi
          path: dist
      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Prepare release assets
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.number }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        shell: bash
        run: |
          test -s "dist/meme-extension-$VERSION-unsigned.xpi"
          if [[ -n "$WEB_EXT_API_KEY" && -n "$WEB_EXT_API_SECRET" ]]; then
            npm ci --ignore-scripts
            npx --no-install web-ext sign --source-dir extension --channel unlisted --artifacts-dir "$RUNNER_TEMP/signed"
            cp "$RUNNER_TEMP"/signed/*.xpi "dist/meme-extension-$VERSION.xpi"
            echo 'Install the Mozilla-signed XPI in Firefox. The unsigned XPI is also available for temporary loading.' > "$RUNNER_TEMP/notes.md"
          elif [[ -n "$WEB_EXT_API_KEY" || -n "$WEB_EXT_API_SECRET" ]]; then
            echo '::error::Configure both AMO signing secrets.'
            exit 1
          else
            echo 'Download the unsigned XPI, open `about:debugging#/runtime/this-firefox`, choose **Load Temporary Add-on**, and select the XPI. Firefox removes temporary add-ons when it restarts.' > "$RUNNER_TEMP/notes.md"
          fi
          echo >> "$RUNNER_TEMP/notes.md"
          echo "See the [keyboard controls and installation guide](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/README.md)." >> "$RUNNER_TEMP/notes.md"
          (cd dist && sha256sum *.xpi > SHA256SUMS)
      - name: Publish the tested version
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.xpi dist/SHA256SUMS --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
